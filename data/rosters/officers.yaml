# Officers named "THE PRESIDENT" and "THE SECRETARY" in floor transcripts.
#
# lieutenant_governors: "THE PRESIDENT" is the Lieutenant Governor presiding. Official terms (until is the
# last day in office; null while serving). Nobody is matched while the office is vacant (March 2008 - July
# 2009, August - September 2021, April - May 2022). Checked against the 1993-2026 cover pages, which name
# the Lieutenant Governor whenever one opened the day ("LT. GOVERNOR MARY O. DONOHUE, President").
lieutenant_governors:
- name: Stan Lundine
  from: 1987-01-01
  until: 1994-12-31
- name: Betsy McCaughey Ross
  from: 1995-01-01
  until: 1998-12-31
- name: Mary O. Donohue
  from: 1999-01-01
  until: 2006-12-31
- name: David A. Paterson
  from: 2007-01-01
  until: 2008-03-16   # became Governor on March 17, 2008
- name: Richard Ravitch
  from: 2009-07-08
  until: 2010-12-31
- name: Robert J. Duffy
  from: 2011-01-01
  until: 2014-12-31
- name: Kathleen C. Hochul
  from: 2015-01-01
  until: 2021-08-23   # became Governor on August 24, 2021
- name: Brian A. Benjamin
  from: 2021-09-09
  until: 2022-04-12   # resigned
- name: Antonio Delgado
  from: 2022-05-25
  until: null

# secretaries: each transcript's cover page names the Secretary of the Senate that day
# ("ALEJANDRA N. PAULINO, ESQ., Secretary"). cover: surname spellings seen on cover pages, typos included.
secretaries:
- name: Stephen F. Sloan
  cover: [SLOAN]
- name: Steven M. Boggess
  cover: [BOGGESS, BOGGES]
- name: Angelo J. Aponte
  cover: [APONTE]
- name: Mary Kay Berger
  cover: [BERGER]
- name: Francis W. Patience
  cover: [PATIENCE]
- name: Alejandra N. Paulino
  cover: [PAULINO]
