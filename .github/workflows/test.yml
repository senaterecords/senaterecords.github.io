name: Test
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "docs/**", "*.md"]
  pull_request:
permissions:
  contents: read
jobs:
  pipeline:
    # The same pinned image as the Update workflow (see there), so the tests run where the site is built.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline[dev]"
      - run: pytest -q
        working-directory: pipeline
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Under a base path
        run: npx playwright test tests/e2e/base.spec.ts
        env:
          SITE_BASE: /ontherecord/
