name: Update
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild and publish even if nothing changed"
        type: boolean
        default: false
  # A change to the code or the hand-kept data rebuilds the site. (The hourly run's own data commits don't trigger
  # workflows: GitHub never starts one from a push made with the workflow's token.)
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "site/**"
      - "!site/tests/**"
      - "scripts/**"
      - "data/overrides/**"
      - "data/rosters/**"
      - ".github/workflows/update.yml"
# One run at a time: a manual run during a scheduled one waits its turn.
concurrency:
  group: update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    # Only main is published: a manual run started on another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      publish: ${{ steps.go.outputs.publish }}
      raw: ${{ steps.go.outputs.raw }}
      code: ${{ steps.go.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # No token left in .git/config while the build runs third-party packages; commit-data.sh gets it alone.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline
      - name: Sync with the NY Senate API
        id: sync
        env:
          NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
        run: |
          # Hearings are re-listed in the morning (New York time); two hours, in case a scheduled run starts late.
          case "$(TZ=America/New_York date +%H)" in 07|08) extra="--hearings" ;; *) extra="" ;; esac
          # When the API doesn't answer (exit 4), the run goes on with the records already kept, so a change to the
          # code still publishes; anything half fetched is put back, for the next hour's run to fetch whole. A refused
          # key (exit 3) or any other failure still stops the run.
          status=0
          python -m nyleg --data data sync $extra || status=$?
          if [ "$status" = 4 ]; then
            echo "::warning::The NY Senate API did not answer. This run publishes with the records already kept."
            git checkout -q -- data && git clean -fdq -- data
            echo "api_down=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
      - name: Save the new data
        # New raw files, or bookkeeping (bills checked, missing or pending) that the next run must not repeat.
        if: steps.sync.outputs.api_down != 'true' && (steps.sync.outputs.changed == 'true' || steps.sync.outputs.state_changed == 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/commit-data.sh "data: sync $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Record the check
        # The site's "Checked 12 min ago": the time of this check on the status branch (scripts/record-check.sh). A
        # check the API didn't answer isn't one.
        if: steps.sync.outputs.api_down != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/record-check.sh
      - name: Decide whether to publish
        id: go
        # When the raw data or the code differs from what was last deployed, or when asked to rebuild; a publish that
        # failed, or was cancelled by a newer run, happens on the next one.
        run: bash scripts/decide-publish.sh "${{ inputs.rebuild == true }}" | tee -a "$GITHUB_OUTPUT"
      - name: Process (with the quality gate)
        if: steps.go.outputs.publish == 'true'
        run: python -m nyleg --data data process --out data/site --gate-against data/quality-deployed.json
      # Kept even when the gate fails, which is when it is most worth reading (the run's Artifacts).
      - uses: actions/upload-artifact@v4
        if: always() && steps.go.outputs.publish == 'true'
        with:
          name: quality
          path: data/site/quality.json
          retention-days: 7
      - uses: actions/setup-node@v4
        if: steps.go.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build, check and split
        if: steps.go.outputs.publish == 'true'
        working-directory: site
        run: |
          npm ci
          npx vitest run
          npm run build
          npm run check
          npm run split
      - uses: actions/upload-pages-artifact@v3
        if: steps.go.outputs.publish == 'true'
        with:
          path: out/main
      # The bills site goes first: its pages carry their own assets, so it can't break, and if the main deploy then
      # fails, bills are already current and their links to main pages still work.
      - name: Publish the bills site
        if: steps.go.outputs.publish == 'true'
        env:
          BILLS_DEPLOY_KEY: ${{ secrets.BILLS_DEPLOY_KEY }}
        run: bash scripts/publish-bills.sh out/bills
      - name: Keep the schedule alive
        if: steps.go.outputs.publish != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # GitHub turns a schedule off after 60 days without activity; touch a file once a week.
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 604800 ]; then
            date -u +%Y-%m-%dT%H:%MZ > data/last-checked.txt
            bash scripts/commit-data.sh "data: weekly keep-alive"
          fi
  # A separate job, so the github-pages environment records a deployment only when something is published.
  deploy:
    needs: update
    if: needs.update.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish the main site
        id: deploy
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the live site
        run: node site/scripts/check-live.mjs https://senaterecords.github.io/
      - uses: actions/download-artifact@v4
        with:
          name: quality
          path: data/site
      - name: Record what is deployed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The quality baseline moves only after a deploy that answers live.
          cp data/site/quality.json data/quality-deployed.json
          echo "${{ needs.update.outputs.raw }}" > data/deployed-raw.txt
          echo "${{ needs.update.outputs.code }}" > data/deployed-code.txt
          bash scripts/commit-data.sh "data: deployed $(date -u +%Y-%m-%dT%H:%MZ)"
